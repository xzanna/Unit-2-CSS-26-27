<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile</title>

    <!-- This ONE line decides how the whole page looks.
         rel="stylesheet" = "this file is CSS"
         href="..."       = where the CSS file lives -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="banner">
        <h1>NovaBlade</h1>
        <p class="tagline">Ranked #12 &middot; Season 7</p>
    </header>

    <main>
        <section class="player-card">
            <h2>Player Stats</h2>
            <p>Main game: <span class="tag">Star Racers</span></p>
            <p>Wins: <span class="stat">248</span></p>
            <p>Win rate: <span class="stat">61%</span></p>
            <a class="btn" href="#">Challenge Me</a>
        </section>

        <section class="about">
            <h2>About</h2>
            <p>Team captain. Night owl. Never rage-quits.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 NovaBlade</p>
    </footer>

</body>
</html>
